<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050510">
<title>Signal Face - UID Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation}

/* প্রিমিয়াম কালারফুল ব্যাকগ্রাউন্ড */
body{display:grid;place-items:center;background:#03040a;font-family:system-ui,sans-serif;color:white;position:relative;overflow:hidden}
body::before{
  content:"";position:absolute;inset:-60%;
  background:radial-gradient(circle at 20% 30%, rgba(255,0,128,0.35), transparent 45%),
             radial-gradient(circle at 80% 20%, rgba(0,229,255,0.35), transparent 45%),
             radial-gradient(circle at 50% 80%, rgba(123,44,191,0.4), transparent 50%),
             radial-gradient(circle at 90% 90%, rgba(255,183,3,0.3), transparent 40%);
  animation:bgMove 10s ease-in-out infinite alternate;
  z-index:0;
  filter:blur(40px);
}
@keyframes bgMove{
  0%{transform:scale(1) translate(0, 0) rotate(0deg);}
  50%{transform:scale(1.1) translate(30px, -20px) rotate(10deg);}
  100%{transform:scale(1.05) translate(-20px, 20px) rotate(-10deg);}
}

body>*{position:relative;z-index:1}
.stars,.stars:before,.stars:after{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.2px,transparent 1.8px);background-size:55px 55px;opacity:.4;animation:twinkle 3s ease-in-out infinite alternate}
.stars:before,.stars:after{content:"";background-size:95px 95px;transform:translate(21px,32px);opacity:.45}
.stars:after{background-size:135px 135px;transform:translate(-30px,-17px)}

/* স্ক্রিনের ঠিক মাঝখানে সুন্দর পপ-আপ কার্ড */
.center-popup-backdrop{
  position:fixed;
  inset:0;
  background:rgba(2, 4, 14, 0.45);
  backdrop-filter:blur(4px);
  display:grid;
  place-items:center;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.28s ease;
}
.center-popup-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.center-popup{
  width:min(84vw, 330px);
  padding:26px 22px 22px;
  border-radius:24px;
  text-align:center;
  backdrop-filter:blur(22px);
  transform:scale(0.65) translateY(20px);
  opacity:0;
  transition:transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.28s ease;
  cursor:pointer;
}
.center-popup-backdrop.show .center-popup{
  transform:scale(1) translateY(0);
  opacity:1;
}

.center-popup.success{
  background:linear-gradient(160deg, rgba(10, 46, 36, 0.92), rgba(7, 22, 34, 0.95));
  border:1.5px solid rgba(26, 255, 140, 0.75);
  box-shadow:0 0 45px rgba(26, 255, 140, 0.35), inset 0 0 22px rgba(26, 255, 140, 0.14);
}
.center-popup.error{
  background:linear-gradient(160deg, rgba(52, 9, 24, 0.94), rgba(20, 8, 28, 0.96));
  border:1.5px solid rgba(255, 59, 92, 0.85);
  box-shadow:0 0 50px rgba(255, 59, 92, 0.45), inset 0 0 22px rgba(255, 59, 92, 0.18);
  animation:popupShake 0.42s ease;
}
@keyframes popupShake{
  0%, 100%{transform:scale(1) translateX(0);}
  20%{transform:scale(1) translateX(-9px);}
  40%{transform:scale(1) translateX(9px);}
  60%{transform:scale(1) translateX(-6px);}
  80%{transform:scale(1) translateX(6px);}
}

.popup-icon-ring{
  width:62px;
  height:62px;
  margin:0 auto 14px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:900;
}
.center-popup.success .popup-icon-ring{
  color:#2aff96;
  background:rgba(26, 255, 140, 0.14);
  border:1.5px solid rgba(26, 255, 140, 0.6);
  box-shadow:0 0 24px rgba(26, 255, 140, 0.4);
}
.center-popup.error .popup-icon-ring{
  color:#ff5470;
  background:rgba(255, 59, 92, 0.16);
  border:1.5px solid rgba(255, 59, 92, 0.65);
  box-shadow:0 0 24px rgba(255, 59, 92, 0.45);
}

.popup-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.center-popup.success .popup-badge{
  color:#7cffbe;
  background:rgba(26, 255, 140, 0.14);
}
.center-popup.error .popup-badge{
  color:#ff94a7;
  background:rgba(255, 59, 92, 0.16);
}

.popup-message{
  margin:0;
  font-size:15.5px;
  font-weight:800;
  line-height:1.5;
  color:#ffffff;
}
.popup-hint{
  margin:12px 0 0;
  font-size:11px;
  color:rgba(255, 255, 255, 0.58);
}

/* লগইন বক্স ডিজাইন */
.login-screen{
  width:min(88vw, 360px);
  padding:32px 24px;
  border-radius:24px;
  background:rgba(12, 17, 45, 0.72);
  border:1.5px solid rgba(111, 250, 255, 0.45);
  box-shadow:0 0 35px rgba(94, 101, 255, 0.4), inset 0 0 25px rgba(72, 234, 255, 0.15);
  backdrop-filter:blur(16px);
  text-align:center;
  transition:opacity 0.4s ease, transform 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
}
.login-screen.shake{
  border-color:rgba(255, 59, 92, 0.85);
  box-shadow:0 0 38px rgba(255, 59, 92, 0.55), inset 0 0 20px rgba(255, 59, 92, 0.2);
  animation:cardShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes cardShake{
  0%, 100%{transform:translateX(0);}
  15%{transform:translateX(-10px) rotate(-1deg);}
  30%{transform:translateX(10px) rotate(1deg);}
  45%{transform:translateX(-8px) rotate(-0.6deg);}
  60%{transform:translateX(8px) rotate(0.6deg);}
  75%{transform:translateX(-4px);}
}

.login-screen.hide{
  opacity:0;
  transform:scale(0.9);
  pointer-events:none;
  display:none;
}
.login-badge{
  display:inline-block;
  padding:5px 14px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#48f5ff;
  background:rgba(72, 245, 255, 0.12);
  border:1px solid rgba(72, 245, 255, 0.35);
  margin-bottom:14px;
}
.login-title{
  margin:0 0 6px;
  font-size:24px;
  font-weight:900;
  background:linear-gradient(90deg, #fff, #7eeeff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.login-sub{
  margin:0 0 22px;
  font-size:13px;
  color:#a9b8e8;
}
.uid-input{
  width:100%;
  padding:15px 16px;
  border-radius:14px;
  border:1.5px solid rgba(111, 250, 255, 0.35);
  background:rgba(5, 8, 24, 0.85);
  color:#fff;
  font-size:18px;
  font-weight:700;
  text-align:center;
  letter-spacing:1.5px;
  outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.uid-input::placeholder{
  color:#586899;
  font-weight:500;
  letter-spacing:0;
  font-size:14px;
}
.uid-input:focus{
  border-color:#39f6ff;
  box-shadow:0 0 18px rgba(57, 246, 255, 0.4);
}
.error-msg{
  min-height:20px;
  margin:10px 0 14px;
  font-size:12.5px;
  font-weight:700;
  color:#ff4d6d;
  line-height:1.4;
}
.login-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:900;
  letter-spacing:1px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg, #00d2ff, #7a5cff 55%, #ff2a85);
  box-shadow:0 6px 25px rgba(122, 92, 255, 0.55);
  transition:transform 0.15s ease, filter 0.15s ease;
}
.login-btn:active{
  transform:scale(0.96);
}
.login-btn:disabled{
  opacity:0.75;
  cursor:wait;
}

/* ড্যাশবোর্ড টপ বার (UID ব্যাজ + লগআউট বাটন) */
.top-bar{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  width:min(94vw, 430px);
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:20;
}
.top-bar.active{
  display:flex;
}
.uid-tag{
  padding:7px 14px;
  border-radius:20px;
  background:rgba(10, 15, 40, 0.78);
  border:1px solid rgba(72, 245, 255, 0.42);
  box-shadow:0 0 15px rgba(72, 245, 255, 0.22);
  backdrop-filter:blur(10px);
  font-size:12px;
  font-weight:800;
  color:#7cf7ff;
  letter-spacing:0.8px;
  display:flex;
  align-items:center;
  gap:7px;
}
.uid-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#1aff8c;
  box-shadow:0 0 8px #1aff8c;
}
.logout-btn{
  padding:7px 14px;
  border-radius:20px;
  border:1px solid rgba(255, 77, 109, 0.55);
  background:rgba(60, 10, 25, 0.78);
  color:#ff8da1;
  font-size:11.5px;
  font-weight:900;
  letter-spacing:0.8px;
  cursor:pointer;
  backdrop-filter:blur(10px);
  box-shadow:0 0 15px rgba(255, 59, 92, 0.25);
  transition:transform 0.15s ease, background 0.2s ease, color 0.2s ease;
}
.logout-btn:hover{
  background:rgba(255, 59, 92, 0.28);
  color:#fff;
}
.logout-btn:active{
  transform:scale(0.94);
}

/* সিগন্যাল ড্যাশবোর্ড স্টেজ */
.stage{
  position:relative;
  width:min(92vw, 430px);
  aspect-ratio:1;
  display:none;
  place-items:center;
  isolation:isolate;
  animation:stageAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.stage.active{
  display:grid;
}
@keyframes stageAppear{
  0%{opacity:0;transform:scale(0.82);}
  100%{opacity:1;transform:scale(1);}
}

.glow{position:absolute;inset:8%;border-radius:50%;background:conic-gradient(#00f5ff,#7457ff,#ff36cf,#ffb547,#7cff8c,#00f5ff);filter:blur(45px);opacity:.6;animation:breathe 2.5s ease-in-out infinite alternate}
.ring{position:absolute;border-radius:50%;inset:2%;border:2px solid transparent;background:linear-gradient(#090d28,#090d28) padding-box,conic-gradient(from 0deg,#39f6ff,#8a57ff,#ff4bd8,#ffe16a,#39f6ff) border-box;box-shadow:0 0 28px #4deaffaa,inset 0 0 30px #a44cff66;animation:rotate 8s linear infinite}
.ring.r2{inset:9%;border-width:1.5px;opacity:.85;animation:rotateBack 12s linear infinite}
.ring.r3{inset:16%;border:1px dashed #8feeffaa;opacity:.7;animation:rotate 22s linear infinite}

.core{position:relative;width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;cursor:pointer;outline:none;
 background:radial-gradient(circle at 34% 25%,#3d568a 0,#17224d 34%,#0b102d 72%);
 border:1.5px solid #b4faffcc;box-shadow:inset 0 0 35px #48eaff44,0 0 35px #5e65ff88,0 0 80px #b13fff66;
 -webkit-tap-highlight-color:transparent}
.core:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #6ffaffaa;box-shadow:0 0 25px #48f5ff;animation:pulse 1.6s ease-in-out infinite}
.core:after{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid #ffffff55;box-shadow:inset 0 0 30px #ff4bd844}
.face{position:relative;z-index:2;width:100%;height:100%;display:grid;place-items:center}

.value{
  font-size:clamp(48px, 15vw, 78px);
  font-weight:950;
  letter-spacing:-1px;
  color:#ff1e3c;
  text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 3px #ff7085, 0 0 15px rgba(255,30,60,0.5);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.value.rolling {
  animation: continuousPulse 0.35s ease-in-out infinite alternate;
}
@keyframes continuousPulse {
  0% { transform: scale(0.92); opacity: 0.75; }
  100% { transform: scale(1.08); opacity: 1; }
}
.value.pop {
  animation: numberPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes numberPop {
  0% { transform: scale(0.7); opacity: 0.3; }
  50% { transform: scale(1.18); }
  100% { transform: scale(1); opacity: 1; }
}

.scan{position:absolute;z-index:1;width:76%;height:2.5px;top:50%;left:12%;background:linear-gradient(90deg,transparent,#9fffff,white,#ff8bea,transparent);box-shadow:0 0 16px #57efff;animation:scan 2.2s ease-in-out infinite}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 16px 5px #49efff;top:50%;left:50%;transform-origin:0 0;animation:orbit 4.5s linear infinite}
.particle.p2{width:6px;height:6px;box-shadow:0 0 16px 5px #ff4bd8;animation-duration:6.5s;animation-direction:reverse}
.particle.p3{width:5px;height:5px;box-shadow:0 0 14px 4px #ffe16a;animation-duration:8.5s}
.flash{position:absolute;inset:0;border-radius:50%;background:#fff;opacity:0;pointer-events:none}
.stage.burst .flash{animation:flash .35s ease-out}

@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes rotateBack{to{transform:rotate(-360deg)}}
@keyframes breathe{to{transform:scale(1.12);opacity:.8;filter:blur(50px)}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.5}}
@keyframes scan{0%{transform:translateY(-48px);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(48px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg) translateX(min(43vw, 190px)) rotate(-360deg)}}
@keyframes twinkle{to{opacity:.12}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
</style>
</head>
<body>
<div class="stars"></div>

<!-- স্ক্রিনের ঠিক মাঝখানে সুন্দর পপ-আপ -->
<div class="center-popup-backdrop" id="popupBackdrop">
  <div class="center-popup success" id="centerPopup">
    <div class="popup-icon-ring" id="popupIcon">✓</div>
    <div class="popup-badge" id="popupBadge">ACTIVE</div>
    <p class="popup-message" id="popupMessage"></p>
    <p class="popup-hint">বন্ধ করতে ট্যাপ করুন</p>
  </div>
</div>

<!-- ১. UID লগইন স্ক্রিন -->
<div class="login-screen" id="loginScreen">
  <div class="login-badge">AVIATOR SERVER CONNECT</div>
  <h2 class="login-title">AVIATOR SIGNAL</h2>
  <p class="login-sub">সিগন্যাল পেতে আপনার গেমের UID লিখুন</p>
  <input type="text" maxlength="40" class="uid-input" id="uidInput" placeholder="একাউন্টের UID লিখুন.........." autocomplete="off">
  <div class="error-msg" id="errorMsg"></div>
  <button type="button" class="login-btn" id="loginBtn">CONNECT &amp; LOGIN</button>
</div>

<!-- লগইন করার পর ড্যাশবোর্ডের উপরে UID ব্যাজ + সাথে সাথে লগআউট বাটন -->
<div class="top-bar" id="topBar">
  <div class="uid-tag"><span class="uid-dot"></span><span id="connectedUidText">UID: ---</span></div>
  <button type="button" class="logout-btn" id="logoutBtn">LOGOUT</button>
</div>

<!-- ২. সিগন্যাল ড্যাশবোর্ড পেজ -->
<main class="stage" id="stage">
 <div class="glow"></div><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
 <i class="particle"></i><i class="particle p2"></i><i class="particle p3"></i>
 <div class="core" id="core" role="button" aria-label="Generate signal" tabindex="0">
  <div class="face"><div class="scan"></div><div class="value rolling" id="value">···</div></div>
  <div class="flash"></div>
 </div>
</main>

const ANC = 1704067200;
const CTD = 5.0, PCT = 3.0, GR = 0.06;
function rDur(v){ return CTD + Math.log(v)/GR + PCT; }
const RST_ARR = new Array(CRASH_SEQUENCE.length);
let TCT = 0;
for(let i=0;i<CRASH_SEQUENCE.length;i++){RST_ARR[i]=TCT;TCT+=rDur(CRASH_SEQUENCE[i]);}

const value=document.getElementById('value'),stage=document.getElementById('stage'),core=document.getElementById('core');
const popupBackdrop=document.getElementById('popupBackdrop');
const centerPopup=document.getElementById('centerPopup');
const popupIcon=document.getElementById('popupIcon');
const popupBadge=document.getElementById('popupBadge');
const popupMessage=document.getElementById('popupMessage');
let lastIdx = -1;
let activeTimer = null;
let signalLoop = null;
let unsubscribeUserWatch = null;
let popupTimer = null;
let isLoggedIn = false;

function hideCenterPopup(){
  if(popupTimer){ clearTimeout(popupTimer); popupTimer = null; }
  popupBackdrop.classList.remove('show');
}

function showCenterPopup(message, type = 'success', duration = 2600){
  if(popupTimer) clearTimeout(popupTimer);
  centerPopup.className = 'center-popup ' + type;
  if(type === 'success'){
    popupIcon.textContent = '✓';
    popupBadge.textContent = 'UID ACTIVATED';
  } else {
    popupIcon.textContent = '!';
    popupBadge.textContent = 'INVALID UID';
  }
  popupMessage.textContent = message;
  popupBackdrop.classList.add('show');
  popupTimer = setTimeout(() => {
    popupBackdrop.classList.remove('show');
  }, duration);
}

popupBackdrop.addEventListener('click', hideCenterPopup);

function triggerInvalidUidEffect(msgText = 'আপনার ইউআইডি সঠিক নয় দয়া করে সঠিক আইডি লিখুন'){
  loginBtn.disabled = false;
  loginBtn.textContent = 'CONNECT & LOGIN';
  errorMsg.textContent = msgText;
  loginScreen.classList.remove('shake');
  void loginScreen.offsetWidth;
  loginScreen.classList.add('shake');
  showCenterPopup(msgText, 'error', 2800);
  uidInput.focus();
}

function updateSignal(){
  if(!isLoggedIn) return;
  const s = Date.now()/1000;
  const sc = ((s-ANC)%TCT+TCT)%TCT;
  let lo=0,hi=RST_ARR.length-1,idx=0;
  while(lo<=hi){const mid=(lo+hi)>>1;if(RST_ARR[mid]<=sc){idx=mid;lo=mid+1;}else hi=mid-1;}
  
  if(idx !== lastIdx){
    lastIdx = idx;
    if(activeTimer) clearInterval(activeTimer);
    
    stage.classList.remove('burst');
    void stage.offsetWidth;
    stage.classList.add('burst');
    
    value.classList.remove('pop');
    value.classList.add('rolling');
    
    let n=0;
    const targetVal = CRASH_SEQUENCE[idx];
    activeTimer=setInterval(()=>{
      value.textContent=(1+Math.random()*8.8).toFixed(2)+'×';
      if(++n>=10){
        clearInterval(activeTimer);
        activeTimer = null;
        value.textContent=targetVal.toFixed(2)+'×';
        
        value.classList.remove('rolling');
        value.classList.add('pop');
      }
    },60);
  }
}

const loginScreen = document.getElementById('loginScreen');
const uidInput = document.getElementById('uidInput');
const loginBtn = document.getElementById('loginBtn');
const errorMsg = document.getElementById('errorMsg');
const topBar = document.getElementById('topBar');
const logoutBtn = document.getElementById('logoutBtn');
const connectedUidText = document.getElementById('connectedUidText');

function cleanUidInput(raw){
  return String(raw || '').trim();
}

uidInput.addEventListener('input', () => {
  errorMsg.textContent = '';
  loginScreen.classList.remove('shake');
});

function logoutUser(reasonText = ''){
  isLoggedIn = false;
  lastIdx = -1;
  if(signalLoop){ clearInterval(signalLoop); signalLoop = null; }
  if(activeTimer){ clearInterval(activeTimer); activeTimer = null; }
  if(unsubscribeUserWatch){ unsubscribeUserWatch(); unsubscribeUserWatch = null; }
  localStorage.removeItem('signal_verified_uid');
  
  stage.classList.remove('active');
  topBar.classList.remove('active');
  loginScreen.classList.remove('hide');
  loginBtn.disabled = false;
  loginBtn.textContent = 'CONNECT & LOGIN';
  errorMsg.textContent = reasonText || '';
}

async function resolveWebsiteUser(rawUid){
  const target = cleanUidInput(rawUid);
  if(!target) return null;

  const directSnap = await get(ref(db, 'users/' + target));
  if(directSnap.exists()){
    return { uid: target, pathKey: target, data: directSnap.val() || {} };
  }

  const allSnap = await get(ref(db, 'users'));
  if(allSnap.exists()){
    const allUsers = allSnap.val() || {};
    const lowerTarget = target.toLowerCase();
    for(const [k, v] of Object.entries(allUsers)){
      if(!v || typeof v !== 'object') continue;
      const candidateUid = String(v.uid || v.userId || v.user_id || k || '').trim();
      if(String(k).toLowerCase() === lowerTarget || candidateUid.toLowerCase() === lowerTarget){
        return { uid: candidateUid || k, pathKey: k, data: v };
      }
    }
  }
  return null;
}

function unlockDashboard(verifiedUid, pathKey, showActivatedMsg = true){
  isLoggedIn = true;
  localStorage.setItem('signal_verified_uid', verifiedUid);
  loginScreen.classList.add('hide');
  topBar.classList.add('active');
  stage.classList.add('active');
  connectedUidText.textContent = 'UID: ' + verifiedUid;

  if(showActivatedMsg){
    showCenterPopup('আপনার আইডি সঠিকভাবে একটিভ হয়েছে', 'success', 2500);
  }

  updateSignal();
  if(signalLoop) clearInterval(signalLoop);
  signalLoop = setInterval(updateSignal, 500);

  if(unsubscribeUserWatch) unsubscribeUserWatch();
  unsubscribeUserWatch = onValue(ref(db, 'users/' + pathKey), (snap) => {
    if(!snap.exists()){
      logoutUser('আপনার ইউআইডি সঠিক নয় দয়া করে সঠিক আইডি লিখুন');
      showCenterPopup('আপনার ইউআইডি সঠিক নয় দয়া করে সঠিক আইডি লিখুন', 'error', 2800);
      return;
    }
    const data = snap.val() || {};
    if(data.banned === true || data.signalBlocked === true){
      logoutUser('আপনার আইডি বর্তমানে স্থগিত করা হয়েছে!');
      showCenterPopup('আপনার আইডি বর্তমানে স্থগিত করা হয়েছে!', 'error', 2800);
    }
  });
}

async function handleLogin(autoUid = null){
  const isAuto = Boolean(autoUid);
  const rawUid = cleanUidInput(autoUid || uidInput.value);

  if(!rawUid){
    if(!isAuto){
      triggerInvalidUidEffect('আপনার ইউআইডি সঠিক নয় দয়া করে সঠিক আইডি লিখুন');
    } else {
      logoutUser('');
    }
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = 'VERIFYING UID...';
  errorMsg.textContent = '';

  try {
    const found = await resolveWebsiteUser(rawUid);

    if(!found){
      if(!isAuto){
        triggerInvalidUidEffect('আপনার ইউআইডি সঠিক নয় দয়া করে সঠিক আইডি লিখুন');
      } else {
        logoutUser('');
      }
      return;
    }

    const userData = found.data || {};
    if(userData.banned === true || userData.signalBlocked === true){
      triggerInvalidUidEffect('আপনার আইডি বর্তমানে স্থগিত করা হয়েছে!');
      return;
    }

    await update(ref(db, 'users/' + found.pathKey), {
      lastSignalLogin: new Date().toISOString()
    }).catch(() => {});

    uidInput.value = found.uid;
    unlockDashboard(found.uid, found.pathKey, !isAuto);
  } catch (err) {
    console.error('Firebase UID Verification Error:', err);
    loginBtn.disabled = false;
    loginBtn.textContent = 'CONNECT & LOGIN';
    errorMsg.textContent = 'সার্ভার সংযোগে সমস্যা হয়েছে! ইন্টারনেট চেক করুন।';
  }
}

loginBtn.addEventListener('click', () => handleLogin());
uidInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    handleLogin();
  }
});

// ড্যাশবোর্ডের LOGOUT বাটনে ক্লিক করলে সাথে সাথে লগআউট হবে
logoutBtn.addEventListener('click', () => {
  logoutUser('');
});

core.addEventListener('click', updateSignal);
core.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();updateSignal();}});

const savedUid = localStorage.getItem('signal_verified_uid');
if(savedUid){
  uidInput.value = savedUid;
  handleLogin(savedUid);
}
